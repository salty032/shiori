name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # better-sqlite3 / onnxruntime-node のネイティブビルドのため Windows で実行する
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      # electron-builder は publish 先のリリースが未作成だと、複数アーティファクト
      # （exe / blockmap / latest.yml）の並列アップロードがそれぞれ「リリース作成」を
      # 同時に走らせ、同一タグのリリースが 2 つできることがある（既知のレース）。
      # 先に空のリリースを 1 つ用意し、electron-builder には既存リリースへ添付だけ
      # させて回避する。再実行で既に存在する場合は作らずに続行する。
      - name: Ensure release exists (avoid duplicate-release race)
        shell: pwsh
        run: |
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --notes "Shiori $env:GITHUB_REF_NAME"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 同梱する ffmpeg は LGPL v3 なので、バイナリを配るなら対応するソースも渡せる
      # 状態にしておく必要がある。NOTICE.md には「各リリースに添付しています」と
      # 書いてあるため、**添付を忘れた時点で表記が嘘になる**。手で上げる前提だと
      # 必ず抜けるので、インストーラを上げた直後に同じ Release へ添付する。
      # 落とすのは同梱バイナリのビルド名に埋まっているコミットちょうど
      # （app/scripts/ffmpeg-build.mjs が原本）。
      - name: Attach FFmpeg source (LGPL)
        shell: pwsh
        run: |
          node scripts/fetch-ffmpeg-source.mjs
          $archive = Get-ChildItem dist/ffmpeg-*-source.tar.gz | Select-Object -First 1
          gh release upload "$env:GITHUB_REF_NAME" $archive.FullName --repo "$env:GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
