name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # better-sqlite3 / onnxruntime-node は postinstall で開発環境と同じネイティブモジュールの
    # rebuild が走るため、開発環境と同じ Windows で実行する。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - run: npm run verify

      # 拡張機能はテストが薄い領域（1,100 行超の JS）なので、manifest / API 誤用を
      # web-ext lint で機械チェックする。
      - run: npm run ext:lint

      # Web デモ版（GitHub Pages）は renderer を別 Vite 設定でビルドし直す。IPC 契約の
      # ズレは verify の typecheck が拾うが、Vite 設定やエントリの破損は実際にビルドしないと
      # 分からず、放置すると pages.yml のデプロイで初めて落ちる。ここで一緒に潰す。
      - run: npm run web:build
